            - generic [ref=e284]:
              - generic [ref=e285]:
                - generic [ref=e287]: "Q: How do you prevent URL sharing to bypass DRM?"
                - generic [ref=e288]: Signed manifest URLs with short TTL (6h) + HMAC-SHA256. Segments are also encrypted — even with the URL, segments can't be decrypted without the DRM license, which is device-bound.
              - generic [ref=e289]:
                - generic [ref=e291]: "Q: What happens if a user's access token is stolen?"
                - generic [ref=e292]: 15-minute TTL limits the damage. Immediate revocation via Redis revocation list. If device theft, user can deregister device from UI — invalidates all tokens for that device.
              - generic [ref=e293]:
                - generic [ref=e295]: "Q: How do you handle GDPR deletion requests?"
                - generic [ref=e296]: Propagate deletion to Cassandra (profile + watch history), S3 (pseudonymized event data), search index, and CDN cache invalidation. PII hashing in the lake means most events become unanonymizable anyway.
              - generic [ref=e297]:
                - generic [ref=e299]: "Q: Why does DRM fail closed instead of open?"
                - generic [ref=e300]: Studio licensing contracts require it. Content cannot be accessed without a valid device-bound license. This is a legal obligation, not a technical preference.
              - generic [ref=e301]:
                - generic [ref=e303]: "Q: How do you enforce concurrent stream limits?"
                - generic [ref=e304]: "Redis Lua script atomically: check current_count < plan_limit, INCR, SADD(sessionId), set TTL=36s. Heartbeat renews TTL. Atomic execution prevents race conditions."
