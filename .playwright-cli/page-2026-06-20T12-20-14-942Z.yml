                - generic [ref=e288]: "Q: How do you prevent URL sharing to bypass DRM?"
                - generic [ref=e289]: Signed manifest URLs with short TTL (6h) + HMAC-SHA256. Segments are also encrypted — even with the URL, segments can't be decrypted without the DRM license, which is device-bound.
              - generic [ref=e290]:
                - generic [ref=e292]: "Q: What happens if a user's access token is stolen?"
                - generic [ref=e293]: 15-minute TTL limits the damage. Immediate revocation via Redis revocation list. If device theft, user can deregister device from UI — invalidates all tokens for that device.
              - generic [ref=e294]:
                - generic [ref=e296]: "Q: How do you handle GDPR deletion requests?"
                - generic [ref=e297]: Propagate deletion to Cassandra (profile + watch history), S3 (pseudonymized event data), search index, and CDN cache invalidation. PII hashing in the lake means most events become unanonymizable anyway.
              - generic [ref=e298]:
                - generic [ref=e300]: "Q: Why does DRM fail closed instead of open?"
                - generic [ref=e301]: Studio licensing contracts require it. Content cannot be accessed without a valid device-bound license. This is a legal obligation, not a technical preference.
