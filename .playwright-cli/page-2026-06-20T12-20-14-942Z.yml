                - generic [ref=e304]: "Q: How do you enforce concurrent stream limits?"
                - generic [ref=e305]: "Redis Lua script atomically: check current_count < plan_limit, INCR, SADD(sessionId), set TTL=36s. Heartbeat renews TTL. Atomic execution prevents race conditions."
